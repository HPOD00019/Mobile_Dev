name: chess
description: "Chess mobile app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  dart_mappable: 4.7.0
  
  # DI container
  get_it: ^9.2.1
  injectable: ^2.7.1
  
  # CQRS/Mediator
  streamline: ^1.5.1
  
  # UI State Management
  provider: ^6.1.5
  
  # Navigation
  go_router: ^17.1.0
  
  # HTTP Client
  dio: ^5.9.2
  
  # Board UI 
  chessground: ^9.0.0
  dartchess: ^0.12.2
  
  uuid: ^4.5.3
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  build_runner: ^2.13.0
  build_verify: 3.1.1
  
  dart_mappable_builder: ^4.7.0
  injectable_generator: ^2.12.1
  
  go_router_builder: 4.2.0
  freezed: ^3.2.5
  
flutter:
  uses-material-design: true
